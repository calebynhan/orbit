name: Bug
description: Something didn't work
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: OS and computer
      placeholder: macOS 15.3 on a MacBook Pro M3 · Windows 11 24H2 · Ubuntu 24.04 (Wayland)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened
      placeholder: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      placeholder: Screenshots, or the project.json from the recording's folder (Movies/Orbit on Mac, Videos/Orbit on Windows and Linux).
